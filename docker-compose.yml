version: '3.8'

services:
  # ---------------------------------------------------------
  # DATABASES & BROKERS
  # ---------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: quickbite-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-quickbite_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quickbite_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quickbite-network

  redis:
    image: redis:7-alpine
    container_name: quickbite-redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quickbite-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: quickbite-rabbitmq
    restart: always
    ports:
      - "5673:5672"   # AMQP protocol port
      - "15673:15672" # Management UI dashboard
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickbite-network

  # ---------------------------------------------------------
  # MICROSERVICES
  # ---------------------------------------------------------
  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: quickbite-core-service
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-quickbite_db}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - quickbite-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: quickbite-order-service
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-quickbite_db}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      KASHIER_API_KEY: ${KASHIER_API_KEY}
      KASHIER_MERCHANT_ID: ${KASHIER_MERCHANT_ID}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - quickbite-network

networks:
  quickbite-network:
    driver: bridge

volumes:
  postgres_data: